<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    div {margin: auto; width: 50%; padding: 10px; text-align: center; background-color: turquoise;}
  </style>
</head>
<body>
    <div class="container">
        <img src="coin.png" class="rounded-circle" width="100">
        <script>
            let peso = 100
            let Yen = 2.68
            let Baht = 0.59

            document.write(" <h2> Click the button below to convert </h2>" + "<kbd>" + 100 + "</kbd>" + "<h2>Pesos to other currencies</h2>")
        </script>
        <p id="display"></p><br>
        <button type="button" class="btn btn-primary"
        onclick="document.getElementById('display').innerHTML='<kbd>' + 100*2.68 + '</kbd>' + 'Japanese Yen';">Yen</button>
        <button type="button" class="btn btn-warning"
        onclick="document.getElementById('display').innerHTML='<kbd>' + 100*0.59 + '</kbd>' + 'Thai Baht';">Baht</button>
    </div>
</body>
</html>
